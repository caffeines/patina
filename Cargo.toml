[package]
name = "patina"
version = "0.1.0"
edition = "2021"
description = "Patina: containers and Linux machines for your Mac. A native Rust desktop app."
default-run = "patina"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
png = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
