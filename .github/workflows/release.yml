# Release Patina when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3).
#
# 1. build:    on Apple silicon, check the tag matches Cargo.toml and run the
#              tests (Homebrew builds Patina from source on Macs).
#    linux:    meanwhile, on Ubuntu 22.04 for x86_64 and aarch64, run the
#              tests and build an AppImage and a .deb with
#              scripts/release-linux.sh.
# 2. release:  once both pass, publish a GitHub release for the tag, with the
#              commits since the last tag, and the AppImages and .debs attached.
#    homebrew: once build passes, point the tap's formula
#              (caffeines/homebrew-patina) at the new tag and its commit, so
#              `brew upgrade patina` builds it. Pre-releases (v1.2.3-beta.1)
#              skip this.
#
# Secrets (Settings > Secrets and variables > Actions):
#   HOMEBREW_TAP_TOKEN   a fine-grained token with Contents: read and write on
#                        caffeines/homebrew-patina. Without it the homebrew
#                        job fails.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release this existing tag again (for example v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Check the tag and test on macOS
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches Cargo.toml
        id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but Cargo.toml says version $version. Bump the version, commit, and tag that commit."
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD)"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  linux:
    name: Test and build for Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # 22.04's glibc (2.35) is old enough for most distributions in use.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build the AppImage and .deb
        run: |
          # appimagetool needs `file`.
          command -v file > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq file; }
          ./scripts/release-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/dist/*.AppImage
            target/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # install.sh checks its download against this.
      - name: Checksum the files
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## Changes"
            echo
            changes=$(git log --no-merges --format='- %s' "$range" | grep -v -E '^- Release [0-9]' || true)
            echo "${changes:-- No changes besides the version.}"
            echo
            echo "## Install"
            echo
            echo "### macOS"
            echo
            echo '```sh'
            echo "brew install caffeines/patina/patina    # builds $TAG from source"
            echo '```'
            echo
            echo "### Linux"
            echo
            echo "Patina uses the Docker Engine on the computer, and you need to be in the \`docker\` group."
            echo "This installs the .deb on Debian and Ubuntu, and the AppImage elsewhere:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Or download the AppImage for your architecture (any distribution), or the .deb (\`sudo apt install ./patina_${VERSION}_amd64.deb\`, or \`_arm64\`)."
            echo
            echo "Linux machines and Kubernetes are macOS-only for now."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changes:** https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            gh release create "$TAG" dist/* --verify-tag --title "Patina $VERSION" --notes-file notes.md $flags
          fi

  homebrew:
    name: Update the Homebrew formula
    # The formula builds from the tag, so it doesn't wait for the Linux
    # packages or the GitHub release.
    needs: build
    if: needs.build.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      COMMIT: ${{ needs.build.outputs.commit }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check for the tap token
        if: env.TAP_TOKEN == ''
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN isn't set, so caffeines/homebrew-patina still points at the previous release. Add the secret and re-run this job, or set tag: \"$TAG\" and revision: \"$COMMIT\" in Formula/patina.rb by hand."
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: caffeines/homebrew-patina
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the formula at the release
        working-directory: tap
        run: |
          sed -i -E \
            -e "s/^( +tag: +\")v[^\"]+\"/\1$TAG\"/" \
            -e "s/^( +revision: +\")[0-9a-f]{40}\"/\1$COMMIT\"/" \
            Formula/patina.rb
          grep -q "tag: *\"$TAG\"" Formula/patina.rb || { echo "::error::Couldn't set the tag in Formula/patina.rb."; exit 1; }
          grep -q "revision: *\"$COMMIT\"" Formula/patina.rb || { echo "::error::Couldn't set the revision in Formula/patina.rb."; exit 1; }
          ruby -c Formula/patina.rb
          if git diff --quiet; then
            echo "The formula already points at $TAG."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "patina $VERSION"
          git push
